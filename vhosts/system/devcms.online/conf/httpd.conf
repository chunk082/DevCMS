<IfModule mod_ssl.c>

	<VirtualHost 66.179.208.184:443 >
		ServerName "devcms.online"
		ServerAlias "www.devcms.online"
		ServerAlias "ipv4.devcms.online"
		UseCanonicalName Off

		CustomLog /var/www/vhosts/system/devcms.online/logs/access_ssl_log plesklog
		ErrorLog "/var/www/vhosts/system/devcms.online/logs/error_log"

		# mailconfig
		<IfModule mod_proxy_http.c>
			<IfModule mod_rewrite.c>
				RewriteEngine On
				RewriteCond %{REQUEST_URI} ^/autodiscover/autodiscover\.xml$ [NC,OR]
				RewriteCond %{REQUEST_URI} ^(/\.well-known/autoconfig)?/mail/config\-v1\.1\.xml$ [NC,OR]
				RewriteCond %{REQUEST_URI} ^/email\.mobileconfig$ [NC]
				RewriteRule ^(.*)$ http://127.0.0.1:8880/mailconfig/ [P,QSA,L,E=REQUEST_URI:%{REQUEST_URI},E=HOST:%{HTTP_HOST}]
			</IfModule>
			<Proxy "http://127.0.0.1:8880/mailconfig/">
				RequestHeader set X-Host "%{HOST}e"
				RequestHeader set X-Request-URI "%{REQUEST_URI}e"
			</Proxy>
		</IfModule>
		# mailconfig

		DocumentRoot "/var/www/vhosts/devcms.online/httpdocs"

		<IfModule mod_suexec.c>
			SuexecUserGroup "mailweb" "psacln"
		</IfModule>

		<IfModule mod_userdir.c>
			UserDir "/var/www/vhosts/devcms.online/web_users/*"
		</IfModule>

		<IfModule mod_sysenv.c>
			SetSysEnv PP_VHOST_ID "8bdb1a31-b58d-403b-930a-b7127ca18393"
		</IfModule>

		SSLEngine on
		SSLVerifyClient none
		SSLCertificateFile /opt/psa/var/certificates/certW3ONPbr

		<Directory /var/www/vhosts/devcms.online/httpdocs>

			<IfModule mod_php4.c>
				php_admin_flag engine off
			</IfModule>

			<IfModule mod_php5.c>
				php_admin_flag engine off
			</IfModule>

			<IfModule mod_php7.c>
				php_admin_flag engine off
			</IfModule>

			SSLRequireSSL

			Options -Includes -ExecCGI

		</Directory>

		DirectoryIndex "index.html" "index.cgi" "index.pl" "index.php" "index.xhtml" "index.htm" "index.shtml"

		<Directory /var/www/vhosts/devcms.online>
			Options -FollowSymLinks
			AllowOverride AuthConfig FileInfo Indexes Limit Options=Indexes,SymLinksIfOwnerMatch,MultiViews,ExecCGI,Includes,IncludesNOEXEC
		</Directory>

		<IfModule mod_headers.c>
		</IfModule>

		#extension sslit begin

		#extension sslit end

		#extension letsencrypt begin
		Alias /.well-known/acme-challenge "/var/www/vhosts/default/htdocs/.well-known/acme-challenge"

		<Location /.well-known/acme-challenge/>
			# Require all granted
			Order Deny,Allow
			Allow from all
			Satisfy any
		</Location>

		<LocationMatch "^/.well-known/acme-challenge/(.*/|)\.">
			# Require all denied
			Order Allow,Deny
			Deny from all
		</LocationMatch>
		#extension letsencrypt end

		#extension sectigo begin
		AliasMatch "^/.well-known/pki-validation/(?!fileauth.txt)$" "/var/www/vhosts/default/htdocs/.well-known/pki-validation/$1"

		<Location /.well-known/pki-validation/>
			# Require all granted
			Order Deny,Allow
			Allow from all
			Satisfy any
		</Location>

		<LocationMatch "^/.well-known/pki-validation/(.*/|)\.">
			# Require all denied
			Order Allow,Deny
			Deny from all
		</LocationMatch>
		#extension sectigo end
	</VirtualHost>

</IfModule>

